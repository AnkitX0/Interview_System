services:
  - type: web
    name: interview-intelligence-backend
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: EMAIL_PROVIDER
        value: "resend"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        value: "https://interview-system-orpin.vercel.app"
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_COOKIE_SAMESITE
        value: "none"
      - key: AUTH_COOKIE_SECURE
        value: "true"

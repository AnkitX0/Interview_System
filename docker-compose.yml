services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/interview.db
    volumes:
      - interview_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=http://localhost:8001
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  interview_data:

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # MediaPipe models and wasm binaries
    location /mediapipe/ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }
}
